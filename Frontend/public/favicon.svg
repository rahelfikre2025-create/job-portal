<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <!-- Light gray circle background -->
  <circle cx="50" cy="50" r="48" fill="#E5E7EB"/>
  
  <!-- Magnifying glass lens frame (dark blue crescent on left, outline on right) -->
  <circle cx="50" cy="40" r="18" fill="none" stroke="#1E3A8A" stroke-width="3.5"/>
  <!-- Thick crescent on left side -->
  <path d="M 32 40 A 18 18 0 0 1 50 22" fill="none" stroke="#1E3A8A" stroke-width="5" stroke-linecap="round"/>
  
  <!-- Light gray crescent inside lens (right side) -->
  <path d="M 50 22 A 18 18 0 0 1 68 40" fill="none" stroke="#9CA3AF" stroke-width="2.5" stroke-linecap="round"/>
  
  <!-- Magnifying glass handle (dark blue, extending down and left) -->
  <path d="M 65 50 L 72 58 L 68 62 L 60 54 Z" fill="#1E3A8A"/>
  
  <!-- Horizontal lines inside lens (staggered pattern) -->
  <line x1="45" y1="34" x2="58" y2="34" stroke="#6B7280" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="42" y1="38" x2="60" y2="38" stroke="#6B7280" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="44" y1="42" x2="56" y2="42" stroke="#6B7280" stroke-width="1.2" stroke-linecap="round"/>
  <line x1="46" y1="46" x2="54" y2="46" stroke="#6B7280" stroke-width="1.2" stroke-linecap="round"/>
  
  <!-- Dots inside lens -->
  <circle cx="50" cy="36" r="1.2" fill="#6B7280"/>
  <circle cx="55" cy="40" r="1.2" fill="#6B7280"/>
</svg>

